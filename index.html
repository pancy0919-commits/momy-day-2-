<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>給最愛的媽媽</title>
    <style>
        body {
            background-color: #111;
            color: #fdf6e2;
            font-family: sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 禮物按鈕區塊 */
        #gift-box {
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s;
        }
        #gift-box:hover {
            transform: scale(1.1);
        }
        .gift-icon {
            font-size: 80px;
            margin-bottom: 10px;
        }
        .gift-text {
            font-size: 20px;
            color: #e76f51;
            font-weight: bold;
        }

        /* 滾動字幕特效區塊 (一開始隱藏) */
        #credits-container {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            text-align: center;
        }

        .credits-content {
            position: absolute;
            width: 100%;
            /* 動畫名稱、時間與往上捲動效果 */
            animation: scrollUp 15s linear forwards;
        }

        .credits-content h2 {
            color: #e76f51;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .credits-content p {
            font-size: 22px;
            line-height: 2.2;
            margin: 15px 0;
            color: #fff;
        }

        /* 定義文字往上跑的動畫 */
        @keyframes scrollUp {
            0% {
                top: 100%; /* 從畫面正下方進場 */
            }
            100% {
                top: -100%; /* 滾動到畫面正上方退場 */
            }
        }
    </style>
</head>
<body>

    <!-- 第一步：禮物畫面 -->
    <div id="gift-box" onclick="openGift()">

<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>禮物盒</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .gift-container {
            position: relative;
            width: 200px;
            height: 200px;
        }
        /* 蝴蝶結 */
        .bow {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 40px;
            z-index: 3;
        }
        .bow::before, .bow::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            border: 6px solid #e74c3c;
            border-radius: 50% 50% 0 50%;
            top: 0;
        }
        .bow::before {
            left: -10px;
            transform: rotate(-45deg);
        }
        .bow::after {
            right: -10px;
            transform: scaleX(-1) rotate(-45deg);
        }
        /* 禮物蓋 */
        .gift-lid {
            position: absolute;
            top: 0;
            left: -10px;
            width: 220px;
            height: 40px;
            background-color: #ff6b6b;
            border-radius: 8px;
            z-index: 2;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        /* 禮物主體 */
        .gift-box {
            position: absolute;
            top: 40px;
            left: 0;
            width: 200px;
            height: 160px;
            background-color: #ff5252;
            border-radius: 0 0 8px 8px;
            z-index: 1;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        /* 緞帶直條 */
        .ribbon-vertical {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 200px;
            background-color: #e74c3c;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="gift-container">
        <div class="bow"></div>
        <div class="gift-lid"></div>
        <div class="ribbon-vertical"></div>
        <div class="gift-box"></div>
    </div>

</body>
</html>

        function openGift() {
